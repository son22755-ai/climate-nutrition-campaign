        body {
            font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;

            display: flex;
            justify-content: center;
            margin: 0;
            padding: 20px;
            color: #2c3e2e;
        }
        .app-container {
            width: 100%;
            max-width: 420px;
            background-color: #ffffff;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 12px rgba(46, 125, 50, 0.08);
            border: 1px solid #e2ebd8;
            position: relative;
            min-height: 650px;
        }

        /* 헤더 */
        .header {
            background-color: #ffffff;
            color: #2e7d32;
            text-align: center;
            padding: 16px;
            font-size: 18px;
            font-weight: 700;
            border-bottom: 1px solid #f0f4ec;
        }
        .header span { color: #fbc02d; }

        .banner {
            background-color: #fffde7;
            color: #f57f17;
            text-align: center;
            padding: 10px;
            font-size: 12px;
            font-weight: 600;
            border-bottom: 1px solid #fff9c4;
        }

        /* 목록 영역 */
        .book-list { padding: 16px; }
        .book-card {
            border: 1px solid #e8f5e9;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 12px;
            background-color: #fff;
            display: flex;
            gap: 12px;
            cursor: pointer;
            transition: box-shadow 0.2s, border-color 0.2s;
        }
        .book-card:hover {
            box-shadow: 0 4px 8px rgba(76, 175, 80, 0.12);
            border-color: #c8e6c9;
        }

        .book-cover {
            width: 70px;
            height: 95px;
            background-color: #f1f8e9;
            border-radius: 4px;
            object-fit: cover;
            flex-shrink: 0;
        }

        .book-info {
            display: flex;
            flex-direction: column;
            justify-content: center;
            flex-grow: 1;
        }
        .book-title { font-size: 15px; font-weight: 700; margin-bottom: 4px; color: #1b5e20; }
        .book-author { font-size: 12px; color: #689f38; margin-bottom: 6px; }
        .book-desc { font-size: 12px; color: #556b2f; line-height: 1.3; }

        /* 이미지 출처 하단 스타일 */
        .footer-source {
            text-align: center;
            font-size: 11px;
            color: #888;
            padding: 12px 16px 20px 16px;
            border-top: 1px dashed #e8f5e9;
            margin-top: 8px;
        }

        /* 상세/퀴즈 페이지 영역 */
        #quiz-page {
            display: none;
            padding-bottom: 20px;
        }
        .top-nav {
            display: flex;
            align-items: center;
            padding: 12px 15px;
            border-bottom: 1px solid #f0f4ec;
            background-color: #fff;
        }
        .back-btn {
            font-size: 20px;
            cursor: pointer;
            color: #2e7d32;
            margin-right: 12px;
            font-weight: bold;
        }
        .nav-title { font-size: 15px; font-weight: 600; color: #2e7d32; }

        .quiz-content { padding: 20px; text-align: center; }
        .selected-book-title { font-size: 18px; font-weight: 700; margin-bottom: 15px; color: #1b5e20; }

        .quiz-box {
            background-color: #f1f8e9;
            border: 1px solid #dedede;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .quiz-question { font-size: 15px; font-weight: 600; line-height: 1.4; color: #2e7d32; }

        /* OX 버튼 */
        .ox-container { display: flex; gap: 15px; justify-content: center; margin-bottom: 20px; }
        .ox-btn {
            width: 80px;
            height: 80px;
            font-size: 32px;
            font-weight: bold;
            border-radius: 50%;
            border: 3px solid #fbc02d;
            background-color: #fffde7;
            color: #f57f17;
            cursor: pointer;
            transition: all 0.2s;
        }
        .ox-btn:hover { background-color: #fbc02d; color: #fff; }

        /* 결과 창 */
        .result-box { display: none; margin-top: 15px; }
        .incorrect-msg { color: #d32f2f; font-weight: bold; font-size: 14px; }

            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

            font-size: 18px;
            font-weight: 700;
            color: #1b5e20;
            margin-bottom: 8px;
        }
        .result-page-desc {
            font-size: 13px;
            color: #558b2f;
            margin-bottom: 16px;
        }

            width: 100%;
            max-width: 320px;
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

            font-size: 13px;
            font-weight: 700;
            color: #2e7d32;
            margin-bottom: 6px;
            align-self: flex-start;

            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(46, 125, 50, 0.15);

            border: 2px solid #fffde7;

            font-size: 14px;
            font-weight: 700;
            color: #2e7d32;
            background-color: #e8f5e9;
            padding: 10px 16px;
            border-radius: 20px;
            margin-bottom: 15px;

    let currentBook = null;

    function renderBookList() {
        const container = document.getElementById('book-list-container');
        container.innerHTML = '';

        books.forEach(book => {
            const card = document.createElement('div');
            card.className = 'book-card';
            card.onclick = () => openQuiz(book.id);

            card.innerHTML = `
                <img src="${book.cover}" alt="${book.title}" class="book-cover" />
                <div class="book-info">
                    <div class="book-title">${book.title}</div>
                    <div class="book-author">${book.author}</div>
                    <div class="book-desc">${book.desc}</div>
                </div>
            `;
            container.appendChild(card);
        });
    }

    function openQuiz(bookId) {
        currentBook = books.find(b => b.id === bookId);

        document.getElementById('quiz-book-title').innerText = `[${currentBook.title}] O/X 퀴즈`;
        document.getElementById('quiz-question-text').innerText = currentBook.question;

        document.getElementById('result-box').style.display = 'none';
        document.getElementById('incorrect-msg').style.display = 'none';

        hideAllPages();
        document.getElementById('quiz-page').style.display = 'block';
        window.scrollTo(0, 0);
    }

    function goBack() {
        hideAllPages();
        document.getElementById('main-page').style.display = 'block';
        window.scrollTo(0, 0);
    }

    function hideAllPages() {
        document.getElementById('main-page').style.display = 'none';
        document.getElementById('quiz-page').style.display = 'none';
        document.getElementById('postcard-page').style.display = 'none';
    }

    function checkAnswer(userChoice) {
        const resultBox = document.getElementById('result-box');
        const incorrectMsg = document.getElementById('incorrect-msg');

        if (userChoice === currentBook.answer) {
            document.getElementById('postcard-book-title').innerText = `[${currentBook.title}] 퀴즈 정답!`;

            // 1. 도서 전용 엽서 및 다운로드 설정 (.png)
            const imgBook = document.getElementById('postcard-img-book');
            const downloadBook = document.getElementById('download-link-book');
            imgBook.src = currentBook.bookPostcard;
            downloadBook.href = currentBook.bookPostcard;
            downloadBook.download = `${currentBook.title}_전용엽서.png`;

            // 2. 주제별 공통 엽서 및 다운로드 설정 (.png)
            const categoryLabel = document.getElementById('category-label');
            const imgCategory = document.getElementById('postcard-img-category');
            const downloadCategory = document.getElementById('download-link-category');
            
            categoryLabel.innerText = `📌 [${currentBook.categoryName}] 주제별 공통 엽서`;
            imgCategory.src = currentBook.categoryPostcard;
            downloadCategory.href = currentBook.categoryPostcard;
            downloadCategory.download = `${currentBook.categoryName}_공통엽서.png`;

            // 카운터 API 호출
            fetch(`https://api.countapi.xyz/hit/${CAMPAIGN_KEY}/val`)
                .then(res => res.json())
                .then(data => {
                    document.getElementById('total-count').innerText = data.value.toLocaleString();
                })
                .catch(() => {
                    document.getElementById('total-count').innerText = "1";
                });

            hideAllPages();
            document.getElementById('postcard-page').style.display = 'block';
            window.scrollTo(0, 0);
        } else {
            resultBox.style.display = 'block';
            incorrectMsg.style.display = 'block';
        }
    }

    window.onload = renderBookList;
</script>
</body>
</html>
